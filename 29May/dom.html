<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1 id="hello" class="hello">Helllo</h1>

    <!-- Show the heading -->
    <button onclick="hide()">Show</button>

    <!-- Hide the heading -->
    <button onclick="show()">Hide</button>

    <!-- Toggle the heading visibility -->
    <button onclick="both()">Both Hide and Show </button>

</body>

<script>

    // Function to hide the h1 element
    function show() {

        const change = document.querySelector("#hello"); // Select the element with id="hello"

        console.log(change); // Display the element in the console

        change.style.display = "none"; // Hide the element
    }

    // Function to show the h1 element
    function hide() {

        const change = document.querySelector("#hello"); // Select the element with id="hello"

        console.log(change); // Display the element in the console

        change.style.display = "block"; // Show the element
    }

    // Function to toggle show/hide
    function both() {

        const change = document.querySelector("#hello"); // Select the element with id="hello"

        console.log(change.style.display); // Display current display value

        if (change.style.display === "none") { // Check if element is hidden

            change.style.display = "block"; // Show the element

        } else {

            change.style.display = "none"; // Hide the element
        }
    }

    // Function to create a new h1 element
    function add(name) {

        const body = document.querySelector("body"); // Select the body element

        const li = document.createElement("h1"); // Create a new h1 element

        li.innerHTML = `${name}`; // Set text using the name argument

        li.setAttribute("id", "google"); // Add id attribute

        body.appendChild(li); // Add the new element to the page
    }

    add("Mudasir"); // Create first h1 element

    add("Aziz"); // Create second h1 element

</script>
</html>
