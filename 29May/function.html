<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<script>

    // Function with no parameters
    function morning() {

        console.log("My Name Is Mudasir"); // Print name message
        console.log("My Best Friend"); // Print friend message

        document.write("Hello"); // Write directly to HTML page
    }

    morning(); // Call function


    // ----------------------------
    // Function with no parameters (repeat call example)
    // ----------------------------

    function mor() {
        console.log("Good Morning"); // Morning message
        console.log("Good evening"); // Evening message
    }

    mor(); // First call
    mor(); // Second call
    mor(); // Third call


    // ----------------------------
    // Simple function
    // ----------------------------

    function add() {
        console.log(7 + 6); // Print sum
    }

    add(); // Call function


    // ----------------------------
    // Function with parameter
    // ----------------------------

    function addition(name) {
        console.log(`Good Morning ${name}`); // Greeting with name
    }

    addition("Mudasir"); // Pass argument


    // ----------------------------
    // Function with two parameters
    // ----------------------------

    function mul(x, y) {
        console.log(x + y); // Print sum of x and y
    }

    mul(3, 4); // 7
    mul(100, 200); // 300


    // ----------------------------
    // Function expression
    // ----------------------------

    const name = function (name) {
        console.log("My New Function", name); // Print name
    };

    name("Mudasir"); // Call function expression


    // ----------------------------
    // Function with return value
    // ----------------------------

    function sub(x, y) {
        return x - y; // return difference
    }

    console.log(sub(99, 4)); // Output result directly

    const sum = sub(66, 4); // Store returned value
    console.log(sum); // Print stored value

</script>

</body>
</html>
