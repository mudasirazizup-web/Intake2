<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<script>

    // Function declaration: calculates square of a number
    function square(x) {
        return x * x; // return square result
    }

    console.log(square(4)); // Output: 16

    // Store function result in a variable
    const sq = square(5);
    console.log(sq); // Output: 25


    // ----------------------------
    // Function expression
    // ----------------------------

    // Function stored inside a variable
    let name = function square(x) {
        return x * x; // return square result
    };

    console.log(name(4)); // Output: 16


    // ----------------------------
    // Arrow function
    // ----------------------------

    const add = (name, age) => {
        console.log("Hi From Arrow", name, age); // prints message with name and age
    };

    console.log(add("mudasir", 45)); // function returns undefined


    // ----------------------------
    // Variables (scope example)
    // ----------------------------

    let c = 56;   // block scoped variable
    var e = 45;   // function scoped variable
    const b = 56; // constant value

    function name1() {
        const b = 45; // local variable (different from global b)
        console.log(b); // prints 45 (local scope)
    }

    name1(); // call function

    console.log(e); // prints 45 (global var)

</script>

</body>
</html>
